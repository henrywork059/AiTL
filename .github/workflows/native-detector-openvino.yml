name: Update 28C bound OpenVINO development regression
on:
  push:
    branches: [feature/interactive-3d-simulation]
    paths:
      - '.github/workflows/native-detector-openvino.yml'
      - 'AI_Traffic_Light/scripts/native_detector_openvino.py'
      - 'AI_Traffic_Light/scripts/test_native_detector_openvino.py'
      - 'AI_Traffic_Light/scripts/native_detector_batch.py'
      - 'AI_Traffic_Light/scripts/native_detector_tiled.py'
      - 'AI_Traffic_Light/scripts/native_detector_holdout.py'
      - '.github/scripts/native_detector_method_trial.py'
permissions:
  contents: read
  actions: read
jobs:
  method:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YOLO_AUTOINSTALL: 'false'
      HF_HUB_OFFLINE: '1'
      WANDB_MODE: disabled
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve pinned development inputs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/henrywork059/AiTL/actions/artifacts/15245454146/zip > "$RUNNER_TEMP/development.zip"
          echo '86981ee46bfc982bcf064e59e7c64e7afabed2d203306160ec2a09a8f45a2a4e  '"$RUNNER_TEMP/development.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/development.zip" -d "$RUNNER_TEMP/development-captures"
          gh api repos/henrywork059/AiTL/actions/artifacts/15247571354/zip > "$RUNNER_TEMP/tiles.zip"
          echo '3c9759f3b77dba00896bd92d6fe79646b1e1b42de7713e80a1ab24f614b6ac62  '"$RUNNER_TEMP/tiles.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/tiles.zip" tile-evidence/tile-development-last.pt > "$RUNNER_TEMP/tile-last.pt"
          echo '9c888355e3228db090c98969672a4418eb207e1c0ffa926746091485da84ecba  '"$RUNNER_TEMP/tile-last.pt" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/tiles.zip" tile-evidence/source-dataset-manifest.json > "$RUNNER_TEMP/source-manifest.json"
          gh api repos/henrywork059/AiTL/actions/artifacts/15247099750/zip > "$RUNNER_TEMP/reference.zip"
          echo '475dd335882173a65022a9c300d4a549601511653cb6cfa5dcbd7ebd27610082  '"$RUNNER_TEMP/reference.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/reference.zip" reuse-evidence/paired-validation.json > "$RUNNER_TEMP/reference.json"
          gh api repos/henrywork059/AiTL/actions/artifacts/15253197259/zip > "$RUNNER_TEMP/backend.zip"
          echo '03b475ee1ba95b3602f6de7ec5afd262a1c98d6db4a560dfb5a418976286f1ed  '"$RUNNER_TEMP/backend.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/backend.zip" 'backend-model/*' -d "$RUNNER_TEMP"
      - name: Install isolated CPU inference environment
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchvision==0.26.0
          python -m pip install -r AI_Traffic_Light/apps/pc-studio/backend/requirements.txt ultralytics==8.4.220 openvino==2026.0.0 numpy==2.2.1 opencv-python==4.10.0.84
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/python-packages.txt"
      - name: Verify method and legacy batch regressions
        run: |
          set -euo pipefail
          python AI_Traffic_Light/scripts/test_native_detector_batch.py
          python AI_Traffic_Light/scripts/test_native_detector_holdout.py
          python AI_Traffic_Light/scripts/test_native_detector_tiled_holdout.py
          python AI_Traffic_Light/scripts/test_native_detector_openvino.py
      - name: Execute schema-2 development-only regression
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/mesh-yolo-config
        run: python .github/scripts/native_detector_method_trial.py --captures "$RUNNER_TEMP/development-captures" --weights "$RUNNER_TEMP/tile-last.pt" --source-manifest "$RUNNER_TEMP/source-manifest.json" --reference "$RUNNER_TEMP/reference.json" --openvino-export "$RUNNER_TEMP/backend-model" --evidence "$RUNNER_TEMP/method-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-28c-openvino-bound-development
          retention-days: 14
          path: |
            ${{ runner.temp }}/method-evidence/
            ${{ runner.temp }}/python-packages.txt
          if-no-files-found: warn

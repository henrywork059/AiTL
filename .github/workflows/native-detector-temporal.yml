name: Update 28C isolated temporal detector development
on:
  push:
    branches: [feature/interactive-3d-simulation]
    paths:
      - '.github/workflows/native-detector-temporal.yml'
      - '.github/scripts/native_detector_temporal_trial.py'
      - 'AI_Traffic_Light/scripts/native_detector_temporal_metrics.py'
      - 'AI_Traffic_Light/scripts/test_native_detector_temporal_metrics.py'
permissions:
  contents: read
  actions: read
jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Install pinned native engine and backend
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r AI_Traffic_Light/apps/pc-studio/backend/requirements-sumo-shadow-win-x64.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = python .github/scripts/locate_sumo_bin.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SUMO_HOME=$(Split-Path -Parent $bin)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -m pip install -r AI_Traffic_Light/apps/pc-studio/backend/requirements.txt
      - name: Verify native versions
        run: |
          python .github/scripts/check_sumo_shadow_dependencies.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/locate_sumo_bin.py --verify-versions
      - name: Verify temporal metrics and fault invariants
        run: python AI_Traffic_Light/scripts/test_native_detector_temporal_metrics.py
      - name: Generate complete separate native sequences
        run: python .github/scripts/native_detector_temporal_trial.py generate --captures "$env:RUNNER_TEMP/temporal-captures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-28c-temporal-native-captures
          retention-days: 14
          path: ${{ runner.temp }}/temporal-captures/
          if-no-files-found: warn
  evaluate:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YOLO_AUTOINSTALL: 'false'
      HF_HUB_OFFLINE: '1'
      WANDB_MODE: disabled
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: mesh-28c-temporal-native-captures
          path: ${{ runner.temp }}/temporal-captures
      - name: Retrieve pinned development metadata and qualified original graph only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/henrywork059/AiTL/actions/artifacts/15245454146/zip > "$RUNNER_TEMP/prior.zip"
          echo '86981ee46bfc982bcf064e59e7c64e7afabed2d203306160ec2a09a8f45a2a4e  '"$RUNNER_TEMP/prior.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/prior.zip" manifest.json > "$RUNNER_TEMP/prior.json"
          gh api repos/henrywork059/AiTL/actions/artifacts/15254202779/zip > "$RUNNER_TEMP/reference.zip"
          echo '7565741655484d2901b4c26fbece790e52f58cf7aca600462f22233bd353b2ce  '"$RUNNER_TEMP/reference.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/reference.zip" method-evidence/method.json > "$RUNNER_TEMP/reference.json"
          gh api repos/henrywork059/AiTL/actions/artifacts/15253197259/zip > "$RUNNER_TEMP/backend.zip"
          echo '03b475ee1ba95b3602f6de7ec5afd262a1c98d6db4a560dfb5a418976286f1ed  '"$RUNNER_TEMP/backend.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/backend.zip" 'backend-model/*' -d "$RUNNER_TEMP"
      - name: Install isolated bound inference runtime
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchvision==0.26.0
          python -m pip install -r AI_Traffic_Light/apps/pc-studio/backend/requirements.txt ultralytics==8.4.220 openvino==2026.0.0 numpy==2.2.1 opencv-python==4.10.0.84
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/python-packages.txt"
      - name: Test metric and bound model invariants
        run: |
          python AI_Traffic_Light/scripts/test_native_detector_temporal_metrics.py
          MESH_OPENVINO_REAL_TEST=1 python AI_Traffic_Light/scripts/test_native_detector_openvino.py
      - name: Execute temporal detector development diagnostics
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/mesh-yolo-config
        run: python .github/scripts/native_detector_temporal_trial.py evaluate --captures "$RUNNER_TEMP/temporal-captures" --prior "$RUNNER_TEMP/prior.json" --export "$RUNNER_TEMP/backend-model" --reference "$RUNNER_TEMP/reference.json" --evidence "$RUNNER_TEMP/temporal-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-28c-temporal-detector-evidence
          retention-days: 14
          path: |
            ${{ runner.temp }}/temporal-evidence/
            ${{ runner.temp }}/python-packages.txt
          if-no-files-found: warn

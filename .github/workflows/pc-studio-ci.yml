name: PC Studio candidate CI
on:
  push:
    branches: [feature/interactive-3d-simulation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: python -m pip install -r AI_Traffic_Light/apps/pc-studio/backend/requirements.txt
      - name: Compile
        working-directory: AI_Traffic_Light
        run: python -m compileall -q apps/pc-studio/backend/app scripts
      - name: Structure
        working-directory: AI_Traffic_Light
        run: python scripts/check_structure.py
      - name: Offline regressions
        working-directory: AI_Traffic_Light
        run: python scripts/run_offline_tests.py
      - name: Execute paired seeded network evidence batch
        if: github.event_name == 'push'
        working-directory: AI_Traffic_Light
        run: python scripts/seeded_network_batch.py --output "$env:RUNNER_TEMP/mesh-seeded-network" --duration 120
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: mesh-seeded-network-evidence
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/mesh-seeded-network/
      - name: npm ci
        working-directory: AI_Traffic_Light/apps/pc-studio/frontend
        run: npm ci
      - name: Frontend data access regressions
        working-directory: AI_Traffic_Light/apps/pc-studio/frontend
        run: npm run test:data-access
      - name: Typecheck
        working-directory: AI_Traffic_Light/apps/pc-studio/frontend
        run: npm run typecheck
      - name: Build
        working-directory: AI_Traffic_Light/apps/pc-studio/frontend
        run: npm run build
      - name: Blocking dependency audit (no automatic fixes)
        working-directory: AI_Traffic_Light/apps/pc-studio/frontend
        run: npm audit --audit-level=high --json

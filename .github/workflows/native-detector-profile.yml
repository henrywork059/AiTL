name: Update 28C OpenVINO spatial shape specialization trial
on:
  push:
    branches: [feature/interactive-3d-simulation]
    paths:
      - '.github/workflows/native-detector-profile.yml'
      - '.github/scripts/native_detector_profile_trial.py'
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YOLO_AUTOINSTALL: 'false'
      HF_HUB_OFFLINE: '1'
      WANDB_MODE: disabled
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve pinned development inputs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/henrywork059/AiTL/actions/artifacts/15245454146/zip > "$RUNNER_TEMP/development.zip"
          echo '86981ee46bfc982bcf064e59e7c64e7afabed2d203306160ec2a09a8f45a2a4e  '"$RUNNER_TEMP/development.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/development.zip" -d "$RUNNER_TEMP/development-captures"
          gh api repos/henrywork059/AiTL/actions/artifacts/15247571354/zip > "$RUNNER_TEMP/tiles.zip"
          echo '3c9759f3b77dba00896bd92d6fe79646b1e1b42de7713e80a1ab24f614b6ac62  '"$RUNNER_TEMP/tiles.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/tiles.zip" tile-evidence/tile-development-last.pt > "$RUNNER_TEMP/tile-last.pt"
          echo '9c888355e3228db090c98969672a4418eb207e1c0ffa926746091485da84ecba  '"$RUNNER_TEMP/tile-last.pt" | sha256sum -c -
          gh api repos/henrywork059/AiTL/actions/artifacts/15253776453/zip > "$RUNNER_TEMP/reference.zip"
          echo 'f1dd09497b0265e3b23ea4c4d20172aecfdcdc10e0917e18b7316bb4b3cab719  '"$RUNNER_TEMP/reference.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/reference.zip" method-evidence/development-evaluation.json > "$RUNNER_TEMP/reference.json"
          gh api repos/henrywork059/AiTL/actions/artifacts/15253197259/zip > "$RUNNER_TEMP/backend.zip"
          echo '03b475ee1ba95b3602f6de7ec5afd262a1c98d6db4a560dfb5a418976286f1ed  '"$RUNNER_TEMP/backend.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/backend.zip" 'backend-model/*' -d "$RUNNER_TEMP"
      - name: Install isolated CPU inference environment
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchvision==0.26.0
          python -m pip install -r AI_Traffic_Light/apps/pc-studio/backend/requirements.txt ultralytics==8.4.220 openvino==2026.0.0 numpy==2.2.1 opencv-python==4.10.0.84
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/python-packages.txt"
      - name: Verify timing proxy invariants
        run: python .github/scripts/native_detector_profile_trial.py self-test
      - name: Specialize audited OpenVINO graph spatial dimensions only
        run: python .github/scripts/native_detector_profile_trial.py specialize --parent-export "$RUNNER_TEMP/backend-model" --export-dir "$RUNNER_TEMP/specialized-model"
      - name: Execute counterbalanced fresh-process graph shape profiles
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/mesh-yolo-config
        run: |
          set -euo pipefail
          lscpu > "$RUNNER_TEMP/cpu-info.txt"
          # Same runner, fresh process per repetition. Preserve failed profiles.
          mkdir -p "$RUNNER_TEMP/profile-evidence"
          status=0
          for round in 1 2; do
            if [ "$round" = 1 ]; then
              order="dynamic static-spatial"
            else
              order="static-spatial dynamic"
            fi
            for shape in $order; do
              label="r${round}-${shape}"
              rc=0
              extra=(--export-dir "$RUNNER_TEMP/backend-model")
              if [ "$shape" = static-spatial ]; then
                extra=(--export-dir "$RUNNER_TEMP/specialized-model" --parent-export "$RUNNER_TEMP/backend-model")
              fi
              python .github/scripts/native_detector_profile_trial.py run --backend openvino --shape-profile "$shape" --thread-profile 2 --run-label "$label" --captures "$RUNNER_TEMP/development-captures/val" --weights "$RUNNER_TEMP/tile-last.pt" --reference "$RUNNER_TEMP/reference.json" --evidence "$RUNNER_TEMP/profile-evidence/$label" "${extra[@]}" || rc=$?
              printf '%s,%s\n' "$label" "$rc" >> "$RUNNER_TEMP/profile-evidence/exit-codes.csv"
              if [ "$rc" != 0 ]; then status=1; fi
            done
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-28c-openvino-spatial-explicit-fp32-development
          retention-days: 14
          path: |
            ${{ runner.temp }}/profile-evidence/
            ${{ runner.temp }}/backend-model/
            ${{ runner.temp }}/specialized-model/
            ${{ runner.temp }}/python-packages.txt
            ${{ runner.temp }}/cpu-info.txt
          if-no-files-found: warn

name: Update 28C every-tick native ground truth
on:
  push:
    branches: [feature/interactive-3d-simulation]
    paths:
      - '.github/workflows/native-detector-tick-truth.yml'
      - '.github/scripts/native_detector_tick_truth_trial.py'
      - 'AI_Traffic_Light/scripts/native_detector_tick_truth.py'
      - 'AI_Traffic_Light/scripts/test_native_detector_tick_truth.py'
permissions:
  contents: read
  actions: read
jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Install pinned native engine and backend
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r AI_Traffic_Light/apps/pc-studio/backend/requirements-sumo-shadow-win-x64.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = python .github/scripts/locate_sumo_bin.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SUMO_HOME=$(Split-Path -Parent $bin)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -m pip install -r AI_Traffic_Light/apps/pc-studio/backend/requirements.txt
      - name: Verify native versions
        run: |
          python .github/scripts/check_sumo_shadow_dependencies.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/locate_sumo_bin.py --verify-versions
      - name: Verify temporal metrics and fault invariants
        run: python AI_Traffic_Light/scripts/test_native_detector_tick_truth.py
      - name: Generate expanded native tick traces and fixed sampled images
        run: python .github/scripts/native_detector_tick_truth_trial.py generate --captures "$env:RUNNER_TEMP/tick-truth-captures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-28c-every-tick-native-development
          retention-days: 14
          path: ${{ runner.temp }}/tick-truth-captures/
          if-no-files-found: warn
  verify:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: mesh-28c-every-tick-native-development
          path: ${{ runner.temp }}/tick-truth-captures
      - name: Retrieve pinned prior development manifests only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/henrywork059/AiTL/actions/artifacts/15245454146/zip > "$RUNNER_TEMP/prior.zip"
          echo '86981ee46bfc982bcf064e59e7c64e7afabed2d203306160ec2a09a8f45a2a4e  '"$RUNNER_TEMP/prior.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/prior.zip" manifest.json > "$RUNNER_TEMP/prior.json"
          gh api repos/henrywork059/AiTL/actions/artifacts/15260061226/zip > "$RUNNER_TEMP/old-temporal.zip"
          echo 'e9b9b079e13c3067351c34bf33df74d3e312904c3af7d7aa77922718be7dced3  '"$RUNNER_TEMP/old-temporal.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/old-temporal.zip" manifest.json > "$RUNNER_TEMP/old-temporal.json"
      - name: Install existing capture-validation dependencies
        run: |
          python -m pip install -r AI_Traffic_Light/apps/pc-studio/backend/requirements.txt numpy==2.2.1 opencv-python==4.10.0.84
          python -m pip check
      - name: Reproduce full native truth and bracket analysis
        run: |
          set -euo pipefail
          python AI_Traffic_Light/scripts/test_native_detector_tick_truth.py
          python .github/scripts/native_detector_tick_truth_trial.py verify --captures "$RUNNER_TEMP/tick-truth-captures" --prior "$RUNNER_TEMP/prior.json" --old-temporal "$RUNNER_TEMP/old-temporal.json" --output "$RUNNER_TEMP/tick-truth-review.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-28c-every-tick-native-review
          retention-days: 14
          path: ${{ runner.temp }}/tick-truth-review.json
          if-no-files-found: warn

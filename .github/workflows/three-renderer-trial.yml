name: Three.js renderer dependency and browser trial
on:
  push:
    branches: [feature/interactive-3d-simulation]
    paths:
      - '.github/workflows/three-renderer-trial.yml'
      - '.github/scripts/sumo_migration_trial.py'
      - 'AI_Traffic_Light/apps/pc-studio/frontend/trials/**'
      - 'AI_Traffic_Light/apps/pc-studio/frontend/src/components/roadGeometry.ts'
      - 'AI_Traffic_Light/apps/pc-studio/frontend/src/components/RoadRenderer.ts'
      - 'AI_Traffic_Light/apps/pc-studio/frontend/src/components/ThreeRoadView.tsx'
      - 'AI_Traffic_Light/apps/pc-studio/frontend/src/components/SimulationCamera3D.tsx'
      - 'AI_Traffic_Light/apps/pc-studio/frontend/src/components/NativeProjectionView.tsx'
      - 'AI_Traffic_Light/apps/pc-studio/frontend/src/components/NativeRoadRenderer.ts'
      - 'AI_Traffic_Light/apps/pc-studio/frontend/src/components/NativeRoad3D.tsx'
      - 'AI_Traffic_Light/apps/pc-studio/frontend/src/components/vehicle*.ts'
      - 'AI_Traffic_Light/apps/pc-studio/frontend/src/components/pedestrian*.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-renderer:
    if: github.ref == 'refs/heads/feature/interactive-3d-simulation'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AI_Traffic_Light/apps/pc-studio/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact trial dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact three@0.187.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact @types/three@0.187.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain generated manifests
        run: |
          git diff -- package.json package-lock.json
          Copy-Item package.json "$env:RUNNER_TEMP/mesh-renderer-package.json"
          Copy-Item package-lock.json "$env:RUNNER_TEMP/mesh-renderer-package-lock.json"
          npm view three@0.187.0 license dependencies dist.integrity --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm view @types/three@0.187.0 license dependencies dist.integrity --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact resolved lock
        run: npm ci --no-audit --no-fund
      - name: Blocking security audit
        run: npm audit --audit-level=high --json
      - name: Pure geometry regressions
        run: node --experimental-strip-types trials/roadGeometry.test.mjs
      - name: Vehicle motion regressions
        run: node --experimental-strip-types trials/vehicleMotion.test.mjs
      - name: Pedestrian motion regressions
        run: node --experimental-strip-types trials/pedestrianMotion.test.mjs
      - name: Typecheck trial and production source
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/typescript/bin/tsc --project trials/tsconfig.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone renderer trial
        run: node node_modules/vite/bin/vite.js build --config trials/vite.config.ts
      - name: Headless WebGL smoke and screenshot
        run: node trials/browserTrial.mjs
      - name: Existing frontend regression and build
        run: |
          npm run test:data-access
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-renderer-trial
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/mesh-renderer-package.json
            ${{ runner.temp }}/mesh-renderer-package-lock.json
            ${{ runner.temp }}/mesh-renderer.png

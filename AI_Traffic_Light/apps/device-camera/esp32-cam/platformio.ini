[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; No third-party libraries are required. Arduino-ESP32 provides:
; - esp_camera
; - WiFi / WiFiServer
; - WebServer
; - lwIP sockets
;
; V0310 keeps HTTP only for control/status on port 80 and the existing
; ATL1 length-prefixed TCP JPEG stream on port 81. The entrypoint wraps the
; mature V037 session implementation with the R10-selected production tuning:
; one framebuffer, CAMERA_GRAB_LATEST on PSRAM, and bounded plain send() calls
; capped at an 11,680-byte application write size.
build_src_filter =
    +<main_v0310.cpp>

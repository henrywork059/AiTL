[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; No third-party libraries are required. The Arduino ESP32 core provides:
; - esp_camera
; - WiFi
; - HTTPClient
; - WebServer
;
; This target is for the common AI Thinker ESP32-CAM pin layout used by
; PlatformIO's "esp32cam" board definition.

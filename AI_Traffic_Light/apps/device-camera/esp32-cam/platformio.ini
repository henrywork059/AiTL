[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; No third-party libraries are required. Arduino-ESP32 provides:
; - esp_camera
; - WiFi / WiFiServer
; - WebServer
; - lwIP sockets
;
; V036 uses HTTP only for control/status on port 80 and a persistent
; length-prefixed TCP JPEG stream on port 81.
